<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cableGradEmerald" x1="15" y1="10" x2="85" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="cableGradCyan" x1="30" y1="40" x2="90" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <filter id="alphaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#10b981" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Outer Cable Frame forming Capital 'A' Arch -->
  <path
    d="M 22 84 L 38 18 C 40 13 46 10 52 10 C 58 10 64 13 66 18 L 80 84"
    stroke="url(#cableGradEmerald)"
    stroke-width="6.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#alphaGlow)"
  />

  <!-- Inner Drop Cable (hanging down from apex inside 'A') -->
  <path
    d="M 52 14 L 52 50"
    stroke="#34d399"
    stroke-width="3.5"
    stroke-linecap="round"
    opacity="0.85"
  />

  <!-- Main Horizontal Crossbar Cable -->
  <path
    d="M 33 52 L 70 52"
    stroke="url(#cableGradCyan)"
    stroke-width="5.5"
    stroke-linecap="round"
  />

  <!-- Secondary Parallel Conduit Cross Line -->
  <path
    d="M 37 60 L 67 60"
    stroke="#06b6d4"
    stroke-width="3.5"
    stroke-linecap="round"
    opacity="0.9"
  />

  <!-- Right Looping Cable Branch with Terminal Node Jack -->
  <path
    d="M 68 52 C 78 52 82 54 86 48 C 89 43 86 36 82 34"
    stroke="url(#cableGradCyan)"
    stroke-width="4"
    stroke-linecap="round"
    fill="none"
  />
  <circle cx="82" cy="34" r="5" fill="#0B0F19" stroke="#38bdf8" stroke-width="3" />
  <circle cx="82" cy="34" r="1.5" fill="#38bdf8" />

  <!-- Downward Hanging Cable 1 with Node -->
  <path
    d="M 52 60 L 52 78"
    stroke="#10b981"
    stroke-width="3.5"
    stroke-linecap="round"
  />
  <circle cx="52" cy="82" r="4.5" fill="#0B0F19" stroke="#10b981" stroke-width="2.5" />
  <circle cx="52" cy="82" r="1.2" fill="#34d399" />

  <!-- Downward Hanging Cable 2 with Node -->
  <path
    d="M 66 60 L 68 83"
    stroke="#06b6d4"
    stroke-width="3.5"
    stroke-linecap="round"
  />
  <circle cx="68" cy="88" r="5" fill="#0B0F19" stroke="#06b6d4" stroke-width="2.5" />
  <circle cx="68" cy="88" r="1.5" fill="#38bdf8" />
</svg>
